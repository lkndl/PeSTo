[project]
name = "pesto"
dynamic = ["version"]
description = "Parameter-free geometric deep learning prediction of protein binding interfaces"
readme = "README.md"
requires-python = ">=3.11"
# lower bounds are needed, `uv tool install` resolves from here and not from uv.lock
dependencies = [
    "gemmi>=0.7.5",
    "numpy>=2.4.3",
    "torch>=2.14.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
# only needed for the notebooks, the training and the profiling script
notebooks = [
    "h5py>=3.16.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
pesto = "pesto.predict:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pesto"]
# setuptools-scm would otherwise add every file tracked by git below src/pesto
include-package-data = false

[tool.setuptools.package-data]
pesto = [
    "weights/*/model_ckpt.pt",
    "weights/*/config.py",
    "weights/*/model.py",
]

# the version comes from git: tag v0.2.0 gives 0.2.0, a later commit 0.2.1.devN+g<hash>
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.uv]
# rebuild on a new commit or tag, or the version in the metadata goes stale
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# torch from PyPI brings several GB of CUDA libraries on Linux, the CPU is enough here
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
