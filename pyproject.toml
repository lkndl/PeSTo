[project]
name = "pesto"
version = "0.1.0"
description = "Parameter-free geometric deep learning prediction of protein binding interfaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gemmi>=0.7.5",
    "numpy>=2.4.3",
    "torch>=2.14.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
# only needed for the notebooks, the training and the profiling script
notebooks = [
    "h5py>=3.16.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
]

[tool.uv]
default-groups = ["notebooks"]

[project.scripts]
pesto = "src.predict:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = [
    "weights/*/model_ckpt.pt",
    "weights/*/config.py",
    "weights/*/model.py",
]
